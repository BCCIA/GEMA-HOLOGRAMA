<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEMA</title>
    <link rel="shortcut icon" href="./chat.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Video de fondo -->
    <video id="bg-video" autoplay loop muted playsinline>
      <source src="assets/loop refineria.mp4" type="video/mp4" />
    </video>

    <!-- Animaciones de fondo -->
    <div class="overlay first"></div>
    <div class="overlay second"></div>
    <div class="overlay third"></div>

    <main class="l-main bd-grid">
      <div class="home">
        
        <!-- Información (Lado Izquierdo) -->
        <div class="home-information">
          <h1 class="home-title anime-text">GEMA.</h1>
        </div>

        <!-- Chat (Lado Derecho) -->
        <div class="home-img">
          <div id="chat-container" class="fade-in">
            
            <!-- ✅ CAPA DE BLOQUEO INVISIBLE -->
            <div id="lock-overlay" title="Toque para iniciar"></div>

            <!-- OVERLAY MINIMALISTA: IMAGEN + BOTONES -->
            <div id="interaction-overlay" class="interaction-overlay">
                <div class="interaction-content">
                    <img src="./avatar-preview.png" alt="Avatar Preview" class="overlay-avatar-img">
                    <h3>Hola, selecciona una opción:</h3>
                    <div class="interaction-buttons">
                        <button id="btn-show-avatar" class="interact-btn glass-btn">
                            <ion-icon name="chatbox-ellipses-outline"></ion-icon>
                            Conversar
                        </button>
                        <button id="btn-play-video" class="interact-btn glass-btn">
                            <ion-icon name="play-circle-outline"></ion-icon>
                            Foto
                        </button>
                    </div>
                </div>
            </div>

            <!-- REPRODUCTOR DE VIDEO -->
            <video id="playback-video" class="playback-video video-hidden" playsinline></video>

          </div>
        </div>
        
      </div>
    </main>

    <!-- Contenedor de Botones de Control -->
<div class="control-buttons">
  <!-- Botón de Bloquear -->
  <ion-icon id="lock-btn" name="lock-closed-outline" title="Bloquear sesión"></ion-icon>
  <!-- Botón de Refrescar y Limpiar -->
  <ion-icon id="refresh-btn" name="refresh-circle-outline" title="Limpiar caché y recargar"></ion-icon>
</div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="main.js"></script>
    
    <!-- Iconos -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
